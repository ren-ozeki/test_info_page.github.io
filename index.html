<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=./en/">
    <script>
        const lang = navigator.language || navigator.userLanguage;
        if (lang.startsWith('ja')) {
            window.location.href = './ja/';
        } else {
            window.location.href = './en/';
        }
    </script>
</head>

<body>
    <p>Redirecting...</p>
</body>

</html>
